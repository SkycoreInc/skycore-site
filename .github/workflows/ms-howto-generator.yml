name: Auto MS How-To Generator

on:
  schedule:
    - cron: '0 10 28 * *'  # 28th of every month at 10 AM UTC (picks this month's hot topic)
  workflow_dispatch:          # Manual trigger: Actions tab → Run workflow

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --upgrade google-genai requests feedparser

      - name: Check API keys
        run: |
          if [ -z "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "ERROR: GEMINI_API_KEY secret is not set."
            exit 1
          fi
          echo "GEMINI_API_KEY found OK"
          if [ -z "${{ secrets.PEXELS_API_KEY }}" ]; then
            echo "WARNING: PEXELS_API_KEY not set — images will use Unsplash fallback"
          else
            echo "PEXELS_API_KEY found OK"
          fi

      - name: Generate MS how-to article
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python scripts/generate_ms_howto.py

      - name: Commit and push to main
        run: |
          git config user.name "SkyCore MS HowTo Bot"
          git config user.email "info@skycoresolutions.com"
          git add -A
          git diff --staged --quiet || git commit -m "Auto: new MS how-to guide $(date +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && break
            echo "Push attempt $i failed — retrying in 10s..."
            sleep 10
          done
