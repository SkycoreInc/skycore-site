name: Auto How-To Generator

on:
  schedule:
    - cron: '0 11 */3 * *'   # Every 3 days at 11 AM UTC (offset from blog)
  workflow_dispatch:           # Manual trigger: Actions tab → Run workflow

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --upgrade google-genai requests feedparser

      - name: Check API keys are set
        run: |
          if [ -z "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "ERROR: GEMINI_API_KEY secret is not set."
            exit 1
          fi
          echo "GEMINI_API_KEY found ✓"
          if [ -z "${{ secrets.PEXELS_API_KEY }}" ]; then
            echo "WARNING: PEXELS_API_KEY not set — images will use Unsplash fallback"
          else
            echo "PEXELS_API_KEY found ✓"
          fi

      - name: Generate how-to article
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python scripts/generate_howto.py

      - name: Commit and push to dev
        run: |
          git config user.name "SkyCore HowTo Bot"
          git config user.email "info@skycoresolutions.com"
          git add -A
          git diff --staged --quiet || git commit -m "Auto: new how-to guide $(date +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin dev && git push origin dev && break
            echo "Push attempt $i failed — retrying in 10s..."
            sleep 10
          done

      - name: Open PR to main (if none exists)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh pr list --base main --head dev --state open --json number --jq '.[0].number')
          if [ -z "$EXISTING" ]; then
            gh pr create \
              --base main \
              --head dev \
              --title "Auto: new how-to guide $(date +%Y-%m-%d)" \
              --body "🤖 New how-to article generated by the automated how-to bot. Review the diff and merge to publish to the live site."
            echo "PR created ✓"
          else
            echo "PR #$EXISTING already open — skipping creation"
          fi
