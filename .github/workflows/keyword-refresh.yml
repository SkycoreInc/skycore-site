name: Monthly Keyword Refresh

on:
  schedule:
    - cron: '0 9 1 * *'   # 1st of every month at 9 AM UTC
  workflow_dispatch:        # Manual trigger anytime

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --upgrade requests

      - name: Check API keys
        run: |
          if [ -z "${{ secrets.DATAFORSEO_LOGIN }}" ]; then
            echo "ERROR: DATAFORSEO_LOGIN secret is not set."
            exit 1
          fi
          if [ -z "${{ secrets.DATAFORSEO_PASSWORD }}" ]; then
            echo "ERROR: DATAFORSEO_PASSWORD secret is not set."
            exit 1
          fi
          echo "DataForSEO credentials found OK"

      - name: Refresh keyword queues
        env:
          DATAFORSEO_LOGIN:    ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
        run: python scripts/refresh_keywords.py

      - name: Commit updated keyword queues
        run: |
          git config user.name "SkyCore Keyword Bot"
          git config user.email "info@skycoresolutions.com"
          git add scripts/keyword_queue.json scripts/ms_keyword_queue.json
          git diff --staged --quiet || git commit -m "Auto: refresh keyword queues $(date +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "Push attempt $i failed — retrying in 10s..."
            sleep 10
          done

      - name: Purge Cloudflare cache
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          HTTP=$(curl -s -o /tmp/cf_resp.json -w "%{http_code}" \
            -X POST "https://api.cloudflare.com/client/v4/zones/b880e08e9e0e2e8059ba5774d828011c/purge_cache" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          cat /tmp/cf_resp.json
          [ "$HTTP" = "200" ] && echo "Cache purged" || echo "WARNING: purge returned $HTTP"
