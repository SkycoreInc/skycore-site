name: Purge Cloudflare Cache

# Fires on every push to main (covers manual code pushes).
# The blog/howto generators also call the purge step directly
# because Actions-to-Actions pushes don't re-trigger workflows.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Purge Cloudflare cache
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          HTTP=$(curl -s -o /tmp/cf_resp.json -w "%{http_code}" \
            -X POST "https://api.cloudflare.com/client/v4/zones/b880e08e9e0e2e8059ba5774d828011c/purge_cache" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          cat /tmp/cf_resp.json
          if [ "$HTTP" != "200" ]; then
            echo "ERROR: Cloudflare purge returned HTTP $HTTP"
            exit 1
          fi
          echo "Cache purged successfully"
