name: Auto Blog Generator

on:
  schedule:
    - cron: '0 10 */2 * *'   # Every 2 days at 10 AM UTC
  workflow_dispatch:           # Also allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-generativeai feedparser

      - name: Generate blog post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_blog.py

      - name: Commit and push new post
        run: |
          git config user.name "SkyCore Blog Bot"
          git config user.email "info@skycoresolutions.com"
          git add -A
          git diff --staged --quiet || git commit -m "Auto: new blog post $(date +%Y-%m-%d)"
          git push
